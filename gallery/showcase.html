<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkillFX — Toàn bộ skill</title>
<link rel="stylesheet" href="showcase.css">
</head>
<body>
<header class="top">
  <h1>SkillFX — Toàn bộ skill</h1>
  <div class="ctl">
    <button id="all-play" type="button">Phát tất cả</button>
    <button id="all-stop" type="button">Dừng tất cả</button>
    <label>Tốc độ
      <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option></select>
    </label>
    <a href="index.html">thư viện</a>
    <a href="battle.html">đấu skill</a>
  </div>
</header>
<section class="hero">
  <div id="picker" class="picker"></div>
  <div class="herobar"><button id="prev" type="button" aria-label="Skill trước">◀</button><button id="next" type="button" aria-label="Skill sau">▶</button><button id="s-replay" type="button">Phát lại</button><span class="hint">← → đổi skill · Space phát lại</span></div>
  <div id="big" class="stage big"><canvas id="big-cv"></canvas></div>
  <div class="prog"><i id="s-bar"></i></div>
  <div class="info"><b id="s-name"></b><span id="s-group"></span><span id="s-sub"></span><em id="s-dur"></em></div>
</section>
<main id="main"></main>
<div id="zoom" class="zoom" hidden>
  <div class="zbar"><b id="z-name"></b><button id="z-replay" type="button">Phát lại</button><button id="z-pause" type="button">Tạm dừng</button><button id="z-close" type="button">Đóng</button></div>
  <div class="zbody"><canvas id="z-cv"></canvas></div>
</div>
<script type="module" src="showcase.js"></script>
</body>
</html>
