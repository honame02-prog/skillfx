<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đấu skill</title>
<link rel="stylesheet" href="style.css">
<style>
  :root { --bg: #0d0b14; --panel: #17141f; --line: #2c2738; --ink: #ece8f4; --dim: #9a93aa; --gold: #f2c85b; --lotus: #c88cff; --hp: #4ad38a; --hurt: #e8475f; }
  body { background: var(--bg); color: var(--ink); margin: 0; font-family: "Funnel Sans", system-ui, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 16px; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  .top a { color: var(--dim); }
  .hud { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; margin: 14px 0 10px; }
  .side { display: grid; gap: 6px; }
  .side.r { text-align: right; }
  .name { font-weight: 500; font-size: 15px; }
  .name small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .bar { height: 14px; background: #241f2e; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--hp); transition: width .35s ease; }
  .bar b { position: absolute; inset: 0 auto 0 0; background: #f3e6b0; transition: width 1.1s ease .25s; }
  .side.r .bar i, .side.r .bar b { inset: 0 0 0 auto; }
  .vs { font-family: "Red Hat Mono", monospace; color: var(--dim); font-size: 13px; text-align: center; min-width: 160px; }
  .stage { position: relative; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  canvas { display: block; width: 100%; image-rendering: pixelated; }
  .pop { position: absolute; font: 700 22px "Red Hat Mono", monospace; color: #fff; text-shadow: 0 2px 0 #000, 0 0 8px #000; pointer-events: none; transform: translate(-50%, 0); animation: up 1.1s ease-out forwards; }
  .pop.crit { color: var(--gold); font-size: 30px; }
  @keyframes up { from { opacity: 1; margin-top: 0 } to { opacity: 0; margin-top: -60px } }
  .banner { position: absolute; inset: 0; display: grid; place-items: center; font: 700 64px "Red Hat Mono", monospace; color: #fff; text-shadow: 0 4px 0 #000, 0 0 24px #e8475f; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .banner.on { opacity: 1; }
  .ctl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .ctl button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .ctl button:hover { border-color: #4a425c; }
  .ctl label { color: var(--dim); font-size: 14px; display: flex; gap: 6px; align-items: center; }
  .log { margin-top: 12px; font: 13px/1.6 "Red Hat Mono", monospace; color: var(--dim); max-height: 140px; overflow: auto; }
  @media (max-width: 640px) { .hud { grid-template-columns: 1fr 1fr; } .vs { grid-column: 1 / -1; order: -1; } .banner { font-size: 36px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Đấu skill: Tù Thiên Chỉ đấu Phật Nộ Hoả Liên</h1>
    <a href="./">← về gallery</a>
  </div>
  <div class="hud">
    <div class="side l"><div class="name">Kim Chỉ Tôn <small>Tù Thiên Chỉ</small></div><div class="bar"><b id="trailA"></b><i id="hpA"></i></div></div>
    <div class="vs" id="turn">chuẩn bị</div>
    <div class="side r"><div class="name"><small>Phật Nộ Hoả Liên</small> Liên Hoả Tăng</div><div class="bar"><b id="trailB"></b><i id="hpB"></i></div></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="banner" id="banner">K.O.</div>
  </div>
  <div class="ctl">
    <button id="play">Tạm dừng</button>
    <button id="restart">Đấu lại</button>
    <label>Tốc độ <select id="speed"><option value="0.5">0,5×</option><option value="1" selected>1×</option><option value="1.5">1,5×</option></select></label>
  </div>
  <div class="log" id="log"></div>
</div>
<script type="module" src="battle.js"></script>
</body>
</html>
